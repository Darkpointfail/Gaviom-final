<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting…</title>
  <meta http-equiv="refresh" content="0;url=/verify-email.html" />
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search || '');
      var email = (params.get('email') || '').trim();
      var dest = '/verify-email.html';
      if (email) dest += '?email=' + encodeURIComponent(email);
      window.location.replace(dest);
    })();
  </script>
</head>
<body>
  <p>Redirecting to email verification… <a href="/verify-email.html">Continue</a></p>
</body>
</html>
