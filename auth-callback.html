<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Resource hints: external origins -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link rel="manifest" href="/site.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Confirming email, Gaviom</title>
  <meta name="description" content="Confirming your Gaviom account email." />
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Geist+Mono:wght@400;500&family=Geist:wght@300;400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet" />
    <link rel="preload" as="style" href="/styles.css?v=20260713-mobile-auth" media="(min-width: 769px)" />
  <link rel="stylesheet" href="/styles.css?v=20260713-mobile-auth" media="(min-width: 769px)" />
  <link rel="stylesheet" href="/styles.css?v=20260713-mobile-auth" media="print" onload="this.media='(max-width:768px)'" />
  <noscript><link rel="stylesheet" href="/styles.css?v=20260713-mobile-auth" /></noscript>
  <link rel="stylesheet" href="/mobile.css?v=20260713-mobile-auth" media="print" onload="this.media='screen and (max-width:1024px)'" />
  <noscript><link rel="stylesheet" href="/mobile.css?v=20260713-mobile-auth" media="screen and (max-width: 1024px)" /></noscript>
</head>
<body class="auth-page" data-auth-page="callback">
  <header class="co-head auth-head">
    <div class="wrap co-head-inner">
      <a href="/" class="brand" aria-label="Gaviom home" data-brand-logo="1">
        <img class="brand-logo" src="/images/gaviom-logo-110w.webp" srcset="/images/gaviom-logo-110w.webp 110w, /images/gaviom-logo.webp 453w" sizes="120px" alt="Gaviom" width="120" height="93" decoding="async" />
      </a>
    </div>
  </header>

  <main class="auth-main">
    <div class="wrap auth-shell">
      <section class="auth-card" aria-label="Email confirmation status">
        <h2 class="auth-card__title font-display">Confirm your email</h2>
        <p class="auth-card__sub">One last step to activate your Gaviom account.</p>
        <p class="auth-alert" data-auth-alert hidden role="alert" aria-live="polite"></p>
        <div class="auth-verify-pending" data-auth-callback-status>
          <p class="auth-verify-pending__msg">Preparing email confirmation…</p>
        </div>
        <button type="button" class="btn btn-primary btn-lg auth-submit" data-auth-callback-action hidden>
          Confirm my email
        </button>
        <p class="auth-legal font-mono" data-auth-callback-fallback hidden>
          Having trouble? <a href="/signin.html">Go to sign in</a> and use Resend confirmation.
        </p>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/auth-config.js"></script>
  <script src="/auth.js?v=20260718-supabase-link"></script>

  <script>
(function () {
  function loadGA() {
    if (window.__gaviomGaLoaded) return;
    window.__gaviomGaLoaded = true;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=G-6Z150MVYT0';
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    window.gtag = gtag;
    gtag('js', new Date());
    gtag('config', 'G-6Z150MVYT0');
  }
  if ('requestIdleCallback' in window) {
    requestIdleCallback(loadGA, { timeout: 4000 });
  } else {
    window.addEventListener('load', function () { setTimeout(loadGA, 1500); }, { once: true });
  }
})();
</script>
</body>
</html>
