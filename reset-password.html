<!DOCTYPE html>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Reset password, Gaviom</title>
  <meta name="description" content="Choose a new password for your Gaviom account." />
  <meta name="robots" content="noindex" />

  <link rel="stylesheet" href="/styles.css?v=20260713-mobile-auth" media="(min-width: 769px)" />
  <link rel="stylesheet" href="/styles.css?v=20260713-mobile-auth" media="print" onload="this.media='(max-width:768px)'" />
  <noscript><link rel="stylesheet" href="/styles.css?v=20260713-mobile-auth" /></noscript>
  <link rel="stylesheet" href="/mobile.css?v=20260713-mobile-auth" media="print" onload="this.media='screen and (max-width:1024px)'" />
  <noscript><link rel="stylesheet" href="/mobile.css?v=20260713-mobile-auth" media="screen and (max-width: 1024px)" /></noscript>
</head>
<body class="auth-page" data-auth-page="reset-password">
  <header class="co-head auth-head">
    <div class="wrap co-head-inner">
      <a href="/" class="brand" aria-label="Gaviom home" data-brand-logo="1">
        <img class="brand-logo" src="/images/gaviom-logo-110w.webp" srcset="/images/gaviom-logo-110w.webp 110w, /images/gaviom-logo.webp 453w" sizes="120px" alt="Gaviom" width="120" height="93" decoding="async" />
      </a>
      <a href="/signin.html" class="co-head-back">Back to sign in</a>
    </div>
  </header>

  <main class="auth-main">
    <div class="wrap auth-shell">
      <aside class="auth-aside" aria-label="About password reset">
        <p class="auth-aside__eyebrow font-mono"><span class="bar"></span> Account security</p>
        <h1 class="auth-aside__title font-display">New password.</h1>
        <p class="auth-aside__lede font-quote">Choose a strong password with at least 8 characters. You will stay signed in after saving.</p>
      </aside>

      <section class="auth-card" aria-label="Reset password form">
        <h2 class="auth-card__title font-display">Reset password</h2>
        <p class="auth-card__sub">Need help? <a href="/signin.html">Return to sign in</a></p>

        <p class="auth-alert" data-auth-alert hidden role="alert" aria-live="polite"></p>

        <form class="co-form auth-form" id="auth-reset-password-form" action="/reset-password.html" method="post">
          <div class="co-field">
            <label for="reset-password">New password</label>
            <input id="reset-password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required />
          </div>
          <div class="co-field">
            <label for="reset-password-confirm">Confirm new password</label>
            <input id="reset-password-confirm" name="password_confirm" type="password" autocomplete="new-password" minlength="8" placeholder="Repeat password" required />
          </div>
          <button type="submit" class="btn btn-primary btn-lg auth-submit">Save new password</button>
        </form>

        <p class="auth-legal font-mono">Link expired? Open <a href="/signin.html">sign in</a> and use Forgot password again.</p>
      </section>
    </div>
  </main>

  <footer class="auth-foot">
    <div class="wrap auth-foot-inner font-mono">
      <span>© 2026 Gaviom Inc. · Delaware</span>
      <span><a href="/how.html">How it works</a> · <a href="/privacy.html">Privacy</a></span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/auth-config.js"></script>
  <script src="/auth.js?v=20260713-auth-signin"></script>

  <script>

    if (window.__gaviomGaLoaded) return;
    window.__gaviomGaLoaded = true;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=G-6Z150MVYT0';
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    window.gtag = gtag;
    gtag('js', new Date());
    gtag('config', 'G-6Z150MVYT0');
  }
  if ('requestIdleCallback' in window) {
    requestIdleCallback(loadGA, { timeout: 4000 });
  } else {
    window.addEventListener('load', function () { setTimeout(loadGA, 1500); }, { once: true });
  }
})();
</script>
</body>
</html>
